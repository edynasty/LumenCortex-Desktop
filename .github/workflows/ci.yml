name: ci

on:
  push:
  pull_request:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run visual:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - run: go mod tidy
      - run: go test -v -timeout 90s ./internal/backend
      - run: go vet ./internal/backend

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go mod tidy
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -clean -platform darwin/universal
      - uses: actions/upload-artifact@v4
        with:
          name: LumenCortex-macOS-universal
          path: build/bin/*.app
          if-no-files-found: error
